
name: Collect official job notices

on:
  workflow_dispatch:
  schedule:
    - cron: "25 1 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: jinan-job-radar
  cancel-in-progress: false

jobs:
  collect-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect recruitment notices
        run: python scripts/collect.py

      - name: Save recruitment results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data/jobs.json
          if ! git diff --cached --quiet; then
            git commit -m "Update recruitment data"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
